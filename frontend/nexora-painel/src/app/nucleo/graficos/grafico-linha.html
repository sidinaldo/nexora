<!-- ===================== PONTEIRO, NÃO MOUSE (MOB-2) =====================
     `mousemove` não existe em toque: no celular a etiqueta com o VALOR EXATO simplesmente nunca
     aparecia, e sobrava a forma sem número nenhum.

     `PointerEvent` cobre mouse, dedo e caneta com o mesmo código — ele estende `MouseEvent`, e
     `clientX`/`currentTarget` continuam valendo, então o corpo de `mover()` não mudou uma linha.

     `pointerdown` entra junto porque em toque o `pointermove` só dispara com o dedo JÁ apoiado:
     sem ele, um toque simples não mostraria nada e só arrastar funcionaria.
     ====================================================================== -->
<div class="gl-wrap" (pointermove)="mover($event)" (pointerdown)="mover($event)"
     (pointerleave)="sair($event)" (pointercancel)="sair($event)">
  <svg class="gl-svg" [attr.viewBox]="'0 0 ' + W + ' ' + H" preserveAspectRatio="none">
    <!-- ⚠️ SÓ DESENHA COM DOIS PONTOS OU MAIS. Com um, a linha sai como um `M` solto e a área
         como um polígono de largura zero: invisíveis, e sem nada dizendo por quê. Ver
         `temLinha` no componente. -->
    @if (temLinha()) {
      <path class="gl-area" [attr.d]="areaPath()" />
      <path class="gl-linha" [attr.d]="linhaPath()" vector-effect="non-scaling-stroke" />
    }
    @if (mmPath()) {
      <path class="gl-mm" [attr.d]="mmPath()" vector-effect="non-scaling-stroke" />
    }
    @if (hover(); as h) {
      <line class="gl-guia" [attr.x1]="h.x" [attr.x2]="h.x" [attr.y1]="0" [attr.y2]="H"
            vector-effect="non-scaling-stroke" />
      <circle class="gl-pt" [attr.cx]="h.x" [attr.cy]="h.y" r="5" />
    }
  </svg>

  @if (hover(); as h) {
    <div class="gl-tip" [style.left.%]="h.pct">
      <strong>{{ rotuloValor(h.valor) }}</strong>
      <span class="gl-tip-data">{{ h.data | date:'dd/MM/yyyy' }}</span>
    </div>
  }
  <!-- Dois estados mudos diferentes, e o segundo não existia: "não há dado" e "há dado, mas um
       período só não tem evolução para mostrar". Deixar o segundo em branco fazia a tela parecer
       quebrada justamente quando o número estava certo, no KPI logo acima. -->
  @if (!temDados()) {
    <div class="gl-vazio">{{ rotuloVazio() }}</div>
  } @else if (umPeriodoSo()) {
    <div class="gl-vazio">{{ rotuloUmPeriodo() }}</div>
  }
</div>
