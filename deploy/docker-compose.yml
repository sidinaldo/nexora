# ==========================================================================================
#  NEXORA — PRODUÇÃO. VPS única, Docker Compose, entrada só pelo Cloudflare Tunnel.
#
#  ⚠️ A REGRA QUE ORGANIZA ESTE ARQUIVO: NENHUM `ports:`.
#
#  Não há porta publicada em serviço nenhum. Quem fala com a internet é o `cloudflared`, e ele
#  fala de dentro para fora — abre a conexão com a borda do Cloudflare e recebe o tráfego por
#  ela. O firewall da VPS deixa entrar só a 22.
#
#  Isso troca uma classe inteira de problema: não há porta para varrer, não há certificado para
#  renovar, não há Let's Encrypt com limite de 5 por semana, e mudar de VPS não mexe em DNS.
#
#  ⚠️ E A CONTRAPARTIDA, que precisa estar escrita: o IP do cliente passa a chegar em
#  `CF-Connecting-IP`, e a API precisa de `RATE_LIMIT_CABECALHO_IP=CF-Connecting-IP` para
#  enxergá-lo. Sem isso o rate limit colapsa num balde só e a atribuição de anúncio piora — as
#  duas em silêncio. Ver `ConfiguracaoDeProxy`.
#
#  ⚠️ UM POSTGRES, DOIS DATABASES. Antes eram dois contêineres (17 para o Nexora, 16 para a
#  Evolution). Um só economiza ~200 MB de linha de base e um volume, e o isolamento que importa
#  continua: usuários separados, e `REVOKE CONNECT` cruzado no `postgres/init/01-databases.sh`.
#  O `nexora` não conecta no `evolution` e vice-versa.
#
#  ⚠️ VERSÃO 17, e o pedido dizia 16. O motivo: o banco do Nexora é 17 em dev e a CI roda os
#  1293 testes contra `postgres:17`. Descer para 16 seria testar numa versão e rodar noutra. O
#  schema da Evolution é opaco (Prisma, versionado por eles) e não se importa com a versão.
# ==========================================================================================

name: nexora

services:
  # ------------------------------------------------------------------ a borda
  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    container_name: nexora_cloudflared
    restart: unless-stopped
    mem_limit: ${LIMITE_CLOUDFLARED:-128m}
    # ⚠️ `--no-autoupdate`: contêiner que se atualiza sozinho é uma versão que ninguém escolheu
    # entrando em produção sem deploy. Quem atualiza é a tag acima.
    command: tunnel --no-autoupdate run
    environment:
      # ⚠️ PELO AMBIENTE, E NÃO NO `command`. Token em argv aparece no `ps aux` de qualquer
      # usuário da máquina, no `docker inspect`, e na saída de `docker compose config` — que a
      # própria CI imprime quando o job de deploy falha.
      #
      # E este token não é um detalhe: com ele sozinho alguém repõe o túnel para outro lugar ou
      # ata um conector novo. Ele É a entrada inteira do sistema.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?}
    depends_on:
      - api
    networks: [borda]

  # ------------------------------------------------------------------ aplicação
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: nexora-api:latest
    container_name: nexora-api          # é este nome que o hostname do Tunnel procura
    restart: unless-stopped
    mem_limit: ${LIMITE_API:-2g}
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      ConnectionStrings__Nexora: >-
        Host=db;Port=5432;Database=nexora;Username=nexora;Password=${NEXORA_DB_PASSWORD:?}

      Jwt__Chave: ${JWT_CHAVE:?}

      # ⚠️ PELO NOME DE SERVIÇO, na rede interna. A Evolution não tem hostname público no
      # Tunnel — quem a alcança é só a API, por dentro.
      Evolution__BaseUrl: http://evolution:8080
      Evolution__ApiKey: ${EVOLUTION_API_KEY:?}

      Webhook__Segredo: ${WEBHOOK_SEGREDO:?}
      Cadastro__ChaveAdministracao: ${CADASTRO_CHAVE_ADMIN:?}

      # ⚠️ É ARRAY, e sem o `__0` não liga em nada — a chave some e o CORS fica vazio, o que
      # derruba o painel inteiro com um erro que parece de rede.
      Cors__Origens__0: ${NEXORA_PUBLIC_PANEL_URL:?}
      Email__BaseUrlPainel: ${NEXORA_PUBLIC_PANEL_URL:?}

      # ===== O IP REAL, ATRÁS DO CLOUDFLARE =====
      # Ver o banner do topo. `CF-Connecting-IP` é o único valor que a borda reescreve sempre.
      RateLimit__ConfiarProxyReverso: "true"
      RateLimit__CabecalhoIpReal: ${RATE_LIMIT_CABECALHO_IP:-CF-Connecting-IP}

      # ⚠️ `arquivo` NÃO ENVIA NADA — grava em disco. Um deploy que esqueça de pôr `smtp` faz
      # convite e "esqueci minha senha" falharem em silêncio.
      Email__Provedor: ${EMAIL_PROVEDOR:-arquivo}
      Email__Host: ${EMAIL_HOST:-}
      Email__Porta: ${EMAIL_PORTA:-587}
      Email__UsarSsl: ${EMAIL_USAR_SSL:-true}
      Email__Usuario: ${EMAIL_USUARIO:-}
      Email__Senha: ${EMAIL_SENHA:-}
      Email__Remetente: ${EMAIL_REMETENTE:-nao-responda@nexora.local}
      Email__NomeRemetente: ${EMAIL_NOME_REMETENTE:-Nexora}

      # Caminho ABSOLUTO dentro do volume: relativo resolveria para o WORKDIR e funcionaria por
      # acidente.
      Midia__Raiz: /app/midia

      Agendador__FusoHorario: ${AGENDADOR_FUSO:-America/Sao_Paulo}
      Agendador__HoraDaRodada: ${AGENDADOR_HORA:-8}
      Agendador__RodarNoBoot: "false"
      Demonstracao__Habilitado: "false"
    volumes:
      # ⚠️ A MÍDIA AINDA É DISCO LOCAL. O R2 é bloco próprio: o Nexora não busca mídia por URL,
      # ele lê o base64 do webhook e grava — então mover para lá é escrever `ArmazenamentoS3`,
      # não configurar. Até então o backup leva este volume junto.
      - midia:/app/midia
    networks: [borda, interna, evo]

  # ------------------------------------------------------------------ banco
  db:
    image: postgres:17-alpine
    container_name: nexora-db
    restart: unless-stopped
    mem_limit: ${LIMITE_DB:-4g}
    # SEM `ports:`. O banco guarda as conversas de TODOS os tenants e o isolamento multi-tenant
    # vive na aplicação, não em RLS: uma conexão direta ignora o isolamento inteiro.
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      # Lidas pelo script de init. Não criam nada sozinhas.
      NEXORA_DB_PASSWORD: ${NEXORA_DB_PASSWORD:?}
      EVOLUTION_DB_PASSWORD: ${EVOLUTION_DB_PASSWORD:?}
    # ⚠️ RODA UMA VEZ SÓ, no primeiro boot com volume vazio. Mudar senha depois NÃO passa por
    # aqui — é `ALTER USER` à mão. Está no README.
    volumes:
      - pg:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    # ⚠️ CALIBRADO PARA 16 GB (Hostinger KVM 4). `shared_buffers` a 2 GB cabe folgado dentro do
    # `mem_limit` de 4 GB e deixa espaço para as conexões e o `work_mem`.
    #
    # `effective_cache_size` NÃO ALOCA NADA: é uma dica ao planejador sobre quanto de cache do
    # sistema ele pode contar. Subestimar aqui faz o Postgres preferir varredura sequencial onde
    # o índice seria melhor — e o sintoma é consulta lenta sem nenhuma causa aparente.
    command: >-
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=16MB
      -c maintenance_work_mem=512MB
      -c max_connections=100
    # ⚠️ 64 MB É O DEFAULT DO DOCKER, e é pouco demais com este tuning. O `effective_cache_size`
    # alto faz o planejador escolher plano PARALELO, e os workers alocam memória compartilhada em
    # `/dev/shm`. Estourando ali, a consulta morre com "could not resize shared memory segment:
    # No space left on device" — intermitente, dependente do volume de dado, e com cara de disco
    # cheio quando o disco está vazio.
    shm_size: 512mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [interna, evo]

  # ------------------------------------------------------------------ Evolution
  evolution:
    image: ${EVOLUTION_IMAGE:-evoapicloud/evolution-api}:${EVOLUTION_TAG:-v2.3.7}
    container_name: nexora_evolution
    restart: unless-stopped
    mem_limit: ${LIMITE_EVOLUTION:-4g}
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?}

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: >-
        postgresql://evolution:${EVOLUTION_DB_PASSWORD:?}@db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: nexora_evolution

      # ===== O BLOCO MAIS IMPORTANTE DESTE SERVIÇO =====
      # Os defaults da Evolution são TODOS `true`. Em especial,
      # DATABASE_SAVE_DATA_HISTORIC=true IMPORTA O WHATSAPP INTEIRO do cliente no instante em que
      # ele pareia o número: conversas antigas, contatos, grupos — nada disso é do Nexora, e tudo
      # isso é dado pessoal de TERCEIRO que ninguém pediu para guardar.
      #
      # ⚠️ SE ESTE SERVIÇO FOR RECRIADO EM OUTRO LUGAR, LEVE ESTE BLOCO JUNTO.
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"

      # ---- webhook de volta para a API, POR DENTRO da rede ----
      # `http://nexora-api:8080`, e não o domínio público: o tráfego não sai da máquina, não gasta
      # o Tunnel e o segredo não aparece em log de borda.
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://nexora-api:8080/api/webhook/evolution?token=${WEBHOOK_SEGREDO:?}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"

      # ⚠️ CACHE LOCAL, E NÃO REDIS. Com dois ou três clientes o Redis seria um contêiner e
      # 256 MB para resolver um problema que ainda não existe. Ligar depois é trocar estas duas
      # linhas e subir o serviço.
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"

      LOG_LEVEL: ${EVOLUTION_LOG_LEVEL:-ERROR,WARN}
    volumes:
      # ⚠️ O PAREAMENTO DO WHATSAPP VIVE AQUI. Sem volume nomeado, um `down` desconecta o número
      # e o cliente tem que ler o QR de novo — em produção isso é uma ligação perguntando o que
      # houve.
      - evolution_instances:/evolution/instances
    networks: [evo]

  # ------------------------------------------------------------------ backup
  backup:
    build: ./backup
    image: nexora-backup:latest
    container_name: nexora_backup
    restart: unless-stopped
    mem_limit: ${LIMITE_BACKUP:-512m}
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      # ⚠️ SEM ELA O SCRIPT RECUSA RODAR. Os dumps têm conversa, telefone e foto de TERCEIROS.
      BACKUP_SENHA: ${BACKUP_SENHA:?}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_BACKUP: ${R2_BUCKET_BACKUP:-}
      BACKUP_PUSH_URL: ${BACKUP_PUSH_URL:-}
    volumes:
      # Só leitura: o backup lê a mídia, nunca escreve nela.
      - midia:/dados/midia:ro
      - evolution_instances:/dados/evolution-instances:ro
      # ⚠️ A CÓPIA QUENTE PRECISA DE VOLUME. Sem ele o `/tmp/backup` vive na camada gravável do
      # contêiner, e todo `deploy.sh` — que roda `up -d` depois de um build — recria o serviço e
      # leva junto os dumps dos últimos dois dias. Com o R2 ainda não configurado, o script
      # apenas AVISA e segue com código 0, o heartbeat dispara, e o sistema reporta backup
      # saudável sem nenhuma cópia sobrevivendo a um deploy.
      - backup_local:/tmp/backup
    networks: [interna]

# ---------------------------------------------------------------------- redes
# Três em vez de uma: o `cloudflared` não precisa alcançar o banco, e o banco da Evolution não
# precisa ser alcançável pelo backup por fora. Cada serviço só enxerga o que usa.
networks:
  borda:
    name: nexora_borda
  interna:
    name: nexora_interna
  evo:
    name: nexora_evo

volumes:
  pg:
    name: nexora_pg_prod
  midia:
    name: nexora_midia_prod
  evolution_instances:
    name: nexora_evolution_instances_prod
  backup_local:
    name: nexora_backup_local
