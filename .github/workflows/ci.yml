name: CI

# Em push e em pull request. Os dois: sem o push, um commit direto na branch principal passa
# sem checagem nenhuma; sem o pull request, a checagem só acontece depois do merge, que é tarde.
on:
  push:
  pull_request:

# Um push novo cancela a execução anterior da MESMA branch. Sem isto, uma sequência de commits
# enfileira execuções que já nasceram obsoletas e a fila cresce mais rápido do que anda.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================================
  # BACKEND — contra Postgres REAL, nunca provider in-memory.
  #
  # O provider in-memory não tem índice parcial, não tem ON CONFLICT, não tem check constraint e
  # não aplica query filter do mesmo jeito — e é EXATAMENTE isso que os testes cobrem: o dedupe
  # do webhook, o teto diário de follow-up, o isolamento por empresa. Rodar em memória daria
  # verde sem provar nada, que é pior do que não testar.
  # ==========================================================================================
  backend:
    name: backend (.NET + Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        # A MESMA major do desenvolvimento (17). Testar contra outra major esconderia diferença
        # de comportamento em índice e enum nativo, que é onde o schema mora.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Sem o health check o job começa antes de o banco aceitar conexão e falha de forma
        # intermitente — o pior tipo de falha, porque ensina a "rodar de novo".
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: .NET (versão do global.json)
        uses: actions/setup-dotnet@v4
        with:
          # Do global.json, não fixada aqui: duas fontes para a versão do SDK divergem, e o
          # sintoma é build que passa na máquina e falha no CI (ou o contrário).
          global-json-file: global.json

      - name: Cache dos pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Não há packages.lock.json no repositório, então a chave sai dos .csproj e do
          # manifesto de ferramentas — muda quando uma dependência muda.
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore nexora.sln

      # -warnaserror: warning NOVO reprova. O build está limpo hoje; deixar warning entrar é
      # como o repositório perde o sinal — depois de vinte, ninguém lê mais nenhum.
      - name: Build (warning novo reprova)
        run: dotnet build nexora.sln --no-restore -warnaserror

      - name: Testes
        # A BancoTeste cria o banco e aplica as migrations sozinha; não há passo de setup aqui.
        env:
          NEXORA_TESTE_CONN: Host=localhost;Port=5432;Database=nexora_teste;Username=postgres;Password=postgres
        run: dotnet test nexora.sln --no-build --verbosity normal

  # ==========================================================================================
  # FRONTEND — build de produção e testes headless.
  # ==========================================================================================
  frontend:
    name: frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/nexora-painel

    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # O cache do npm vem embutido no setup-node; a chave sai do package-lock.json.
          cache: npm
          cache-dependency-path: frontend/nexora-painel/package-lock.json

      # `ci` e não `install`: respeita o package-lock e falha se ele estiver fora de sincronia
      # com o package.json, em vez de "consertar" silenciosamente e mascarar a divergência.
      - run: npm ci

      - name: Build
        run: npm run build

      - name: Testes (Chrome headless)
        # ChromeHeadlessCI = ChromeHeadless + --no-sandbox, definido em karma.conf.js. O Chrome
        # já vem no runner do Ubuntu; o sandbox é que não sobrevive ao ambiente.
        run: npm run test:ci

      # ⚠️ A SUÍTE DE CELULAR É OUTRA, E FICOU DE FORA POR MESES. `test:ci` roda a configuração
      # normal; os 97 testes de 390px vivem numa configuração própria do Angular e só rodavam
      # quando alguém lembrava de chamar à mão.
      #
      # Uma suíte que só roda por memória não protege nada: ela fica verde porque ninguém a
      # executa, e quebra em silêncio até o dia em que alguém olha uma tela no celular.
      - name: Testes de celular (390px)
        run: npm run test:celular:ci

  # ==========================================================================================
  # DEPLOY — os arquivos que sobem a produção.
  #
  # ⚠️ NADA AQUI ERA CONFERIDO. O `docker-compose.yml`, os cinco scripts de shell e o script de
  # init do Postgres não passavam por checagem nenhuma: a CI ficava verde e o erro aparecia NA
  # VPS, no meio de um deploy — que é o pior lugar e o pior momento para descobrir um `fi` que
  # faltou.
  #
  # Não sobe nada nem conecta em lugar nenhum: é só leitura e sintaxe.
  # ==========================================================================================
  deploy:
    name: deploy (compose + scripts)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # O compose resolve as variáveis obrigatórias (`${VAR:?}`) antes de validar, então sem um
      # arquivo de ambiente ele para na primeira. Estes valores são descartáveis e servem só
      # para a interpolação passar.
      - name: Variáveis de mentira, só para interpolar
        working-directory: deploy
        run: grep -oE '\$\{[A-Z_0-9]+:\?\}' docker-compose.yml | tr -d '${:?}' | sort -u | sed 's/$/=x/' > .env.ci

      - name: O compose é válido
        working-directory: deploy
        run: docker compose --env-file .env.ci config -q

      # ⚠️ A REGRA QUE SUSTENTA O ARRANJO INTEIRO: nenhum serviço publica porta. Quem fala com a
      # internet é o `cloudflared`, de dentro para fora, e o firewall da VPS deixa entrar só a
      # 22. Um `ports:` acrescentado "só para testar" abre um caminho alternativo — e é sobre a
      # AUSÊNCIA dele que o `ConfiarProxyReverso: true` se apoia: com outra entrada, qualquer um
      # forja o cabeçalho de IP e escapa de todos os limites.
      - name: Nenhuma porta publicada
        working-directory: deploy
        run: |
          if docker compose --env-file .env.ci config | grep -q 'published:'; then
            echo "::error::Algum serviço publica porta. Ver o banner do docker-compose.yml."
            docker compose --env-file .env.ci config | grep -B6 'published:'
            exit 1
          fi
          echo "Nenhuma porta publicada."

      - name: Sintaxe dos scripts
        run: |
          for f in $(find deploy -name '*.sh'); do
            bash -n "$f" || exit 1
            echo "ok: $f"
          done

      # ⚠️ BIT DE EXECUTÁVEL. No Windows o git grava `100644` para arquivo novo, e o sintoma só
      # aparece num clone LIMPO — na máquina de quem criou o arquivo ele roda, porque o sistema
      # de arquivos local não liga. Já aconteceu duas vezes neste repositório; a segunda com o
      # `verificar-backup.sh`, que o `deploy.sh` chama como `./verificar-backup.sh` e faria o
      # deploy morrer no último passo, depois de já ter aplicado migration e subido contêiner.
      #
      # Conferir o MODO NO ÍNDICE, e não `test -x` no disco: o checkout do runner é feito pelo
      # próprio git e refletiria o modo errado sem reclamar.
      - name: Todo script é executável
        run: |
          RUIM=$(git ls-files -s 'deploy/**/*.sh' 'deploy/*.sh' | awk '$1 != "100755" {print $1" "$4}')
          if [ -n "$RUIM" ]; then
            echo "::error::Script sem bit de executável. Corrija com: git update-index --chmod=+x <arquivo>"
            echo "$RUIM"
            exit 1
          fi
          echo "Todos 100755."

      # ⚠️ FIM DE LINHA. Um `.sh` com CRLF faz o bash do Linux ler o retorno de carro como
      # parte do comando, e o erro que sai é "command not found" apontando para uma linha
      # visivelmente correta. O `01-databases.sh` é o pior caso: roda DENTRO do contêiner do
      # Postgres, no primeiro boot, e ninguém olha aquele log — os databases sairiam pela
      # metade e o sintoma apareceria como erro de permissão na primeira migration, longe
      # da causa.
      - name: Nenhum script com CRLF
        run: |
          if find deploy -name '*.sh' -exec file {} + | grep CRLF; then
            echo "::error::Script com fim de linha do Windows. Ver .gitattributes."
            exit 1
          fi
          echo "Todos em LF."

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC1091: não segue `source` de arquivo que só existe no servidor (o .env).
          shellcheck -e SC1091 $(find deploy -name '*.sh')
