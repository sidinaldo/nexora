<div class="pagina">
  <div class="topo">
    <h1>Integrações</h1>
    <p class="sub fraco">
      O que o Nexora conversa com o resto do mundo: avisa o seu sistema quando algo acontece aqui,
      e avisa a Meta de que o lead do anúncio virou venda.
    </p>
  </div>

  <div class="abas bloco" role="tablist">
    <button type="button" class="aba" role="tab"
            [class.ativa]="aba() === 'webhook'"
            [attr.aria-selected]="aba() === 'webhook'"
            (click)="trocarAba('webhook')">
      Webhook
    </button>
    <button type="button" class="aba" role="tab"
            [class.ativa]="aba() === 'anuncios'"
            [attr.aria-selected]="aba() === 'anuncios'"
            (click)="trocarAba('anuncios')">
      Anúncios
    </button>
  </div>

  <!-- `@if` em vez de esconder com CSS: a aba fechada não fica com requisição pendente. Trocar de
       aba recarrega, que é o que se quer numa tela de configuração. -->
  @if (aba() === 'anuncios') {
    <app-integracoes-anuncios />
  } @else {
    <app-integracoes-webhook />
  }
</div>
