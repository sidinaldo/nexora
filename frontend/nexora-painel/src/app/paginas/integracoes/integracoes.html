<div class="pagina">
  <div class="topo">
    <h1>Integrações</h1>
    <p class="sub fraco">
      O que o Nexora conversa com o resto do mundo: avisa a Meta de que o contato do anúncio virou
      venda, e avisa o seu sistema quando algo acontece aqui.
    </p>
  </div>

  <div class="abas bloco" role="tablist">
    @for (a of abas; track a.id) {
      <button type="button" class="aba" role="tab"
              [class.ativa]="aba() === a.id"
              [attr.aria-selected]="aba() === a.id"
              (click)="trocarAba(a.id)">
        {{ a.rotulo }}
        @if (falhasDa(a.id) > 0) {
          <span class="conta falhou">{{ falhasDa(a.id) }} {{ falhasDa(a.id) === 1 ? 'falhou' : 'falharam' }}</span>
        }
      </button>
    }
  </div>

  <!-- `@if` em vez de esconder com CSS: a integração fechada não fica com requisição pendente.
       As duas abas de cada integração usam O MESMO painel, que só troca a parte mostrada —
       ir de "Anúncios" para "Envios à Meta" não recarrega nada. -->
  @if (aba() === 'webhook' || aba() === 'entregas') {
    <app-integracoes-webhook [parte]="aba() === 'entregas' ? 'entregas' : 'configurar'"
                             (falhasNoRegistro)="falhasWebhook.set($event)" />
  } @else {
    <app-integracoes-anuncios [parte]="aba() === 'envios' ? 'envios' : 'configurar'"
                              (falhasNoPeriodo)="falhasMeta.set($event)" />
  }
</div>
